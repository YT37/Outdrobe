# Google Cloud Run service configuration
# Use: gcloud run services replace deploy.yaml --project=$PROJECT_ID
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: outdrobe-functions
  labels:
    app: outdrobe-functions
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/memory: "1Gi"
        run.googleapis.com/cpu: "1000m"
        run.googleapis.com/max-instances: "10"
        run.googleapis.com/min-instances: "0"
        run.googleapis.com/timeout: "300s"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: outdrobe-run-sa@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/outdrobe-functions:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: FLASK_ENV
              value: "production"
            - name: CLASSIFICATION_API_URL
              value: "http://35.243.226.83:8080"
            # Secrets from Google Secret Manager
            - name: KIBANA_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: KIBANA_API_KEY
            - name: FISH_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: FISH_API_KEY
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

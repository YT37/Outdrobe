version: '3.8'

services:
  outdrobe-server:
    build: .
    ports:
      - "8080:8080"
    restart: unless-stopped
    runtime: nvidia
    environment:
      - FLASK_ENV=production
      - PORT=8080
      - TRANSFORMERS_CACHE=/app/cache
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s